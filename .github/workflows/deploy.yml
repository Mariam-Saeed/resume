name: Build and publish resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize main builds/deployments; PR validation uses a separate group per PR.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install XeLaTeX and Inter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex fonts-inter fontconfig
          fc-cache -f

      - name: Compile resume
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export FORCE_SOURCE_DATE=1
          mkdir -p build
          # A second pass resolves page references and PDF bookmarks.
          for pass in 1 2; do
            xelatex -no-shell-escape -interaction=nonstopmode \
              -halt-on-error -file-line-error -output-directory=build resume.tex
          done
          test -s build/resume.pdf
          mkdir -p _site
          cp build/resume.pdf _site/resume.pdf

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}resume.pdf
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy PDF
        id: deployment
        uses: actions/deploy-pages@v5.0.1
